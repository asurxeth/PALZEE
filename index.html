<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PALZEE — Share Real-Time Moments With Friends</title>
    <meta name="description" content="PALZEE by Fin Rein Inc. (Kanpur & Lucknow). Share real-time moments with friends through video pals.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        html, body {
            height: 100vh;
            overflow: hidden;
        }

        body {
            background-color: #ffffff;
            color: #121316;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1rem 0.5rem 1rem;
        }

        .container {
            flex: 1;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto;
            min-height: 0;
        }

        /* Hero Image Container constrained to fit inside 100vh without scrolling */
        #textContainer {
            flex: 1;
            width: 100%;
            max-width: 330px;
            max-height: calc(100vh - 150px);
            margin: 0 auto 0.5rem auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        #textContainer img {
            max-height: 100%;
            max-width: 100%;
            width: auto;
            height: auto;
            display: block;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Store Download Badges matching setlog.kr exactly */
        #storeContainer {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            margin-top: 0.25rem;
            margin-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .qr-badge {
            background: #ffffff;
            padding: 5px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 74px;
            width: 74px;
            flex-shrink: 0;
        }

        .qr-badge svg {
            width: 64px;
            height: 64px;
        }

        .store-badges-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: center;
        }

        .store-badge {
            display: inline-block;
            height: 34px;
            text-decoration: none;
        }

        .store-badge img {
            height: 34px;
            width: 116px;
            object-fit: cover;
            display: block;
            border-radius: 6px;
            transition: transform 0.15s ease;
        }

        .store-badge:hover img {
            transform: translateY(-1px);
        }

        /* Bottom-Left Footer matching setlog.kr exactly */
        footer {
            width: 100%;
            padding: 0.4rem 1.5rem 0.4rem 1.5rem;
            text-align: left;
            font-size: 0.76rem;
            color: #888888;
            line-height: 1.5;
            flex-shrink: 0;
        }

        .footer-line-1 {
            font-weight: 600;
            color: #666666;
        }

        .footer-line-2 {
            margin-top: 2px;
        }

        footer a {
            color: #888888;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        footer a:hover {
            color: #333333;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Hero Graphic set directly to user's exact Ix15A_cleanup.jpg file -->
        <div id="textContainer">
            <img src="Ix15A_cleanup.jpg" 
                 alt="PALZEE — Share real-time moments with friends through video pals">
        </div>

        <!-- Store Download Badges -->
        <div id="storeContainer">
            <div class="qr-badge" title="Scan to download PALZEE">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="100" height="100" fill="white"/>
                    <rect x="8" y="8" width="28" height="28" rx="4" fill="#1E1E24"/>
                    <rect x="14" y="14" width="16" height="16" fill="white"/>
                    <rect x="18" y="18" width="8" height="8" fill="#1E1E24"/>

                    <rect x="64" y="8" width="28" height="28" rx="4" fill="#1E1E24"/>
                    <rect x="70" y="14" width="16" height="16" fill="white"/>
                    <rect x="74" y="18" width="8" height="8" fill="#1E1E24"/>

                    <rect x="8" y="64" width="28" height="28" rx="4" fill="#1E1E24"/>
                    <rect x="14" y="70" width="16" height="16" fill="white"/>
                    <rect x="18" y="74" width="8" height="8" fill="#1E1E24"/>

                    <rect x="42" y="10" width="6" height="6" fill="#1E1E24"/>
                    <rect x="52" y="18" width="6" height="6" fill="#1E1E24"/>
                    <rect x="44" y="28" width="12" height="6" fill="#1E1E24"/>

                    <rect x="10" y="44" width="6" height="12" fill="#1E1E24"/>
                    <rect x="22" y="48" width="12" height="6" fill="#1E1E24"/>
                    <rect x="40" y="42" width="20" height="20" rx="4" fill="#3F395F"/>
                    <text x="50" y="55" font-size="8" font-family="'Fredoka', sans-serif" fill="white" text-anchor="middle" font-weight="bold">PAL</text>

                    <rect x="68" y="44" width="10" height="6" fill="#1E1E24"/>
                    <rect x="84" y="48" width="6" height="12" fill="#1E1E24"/>

                    <rect x="44" y="68" width="8" height="8" fill="#1E1E24"/>
                    <rect x="56" y="76" width="12" height="6" fill="#1E1E24"/>
                    <rect x="74" y="68" width="6" height="14" fill="#1E1E24"/>
                    <rect x="68" y="86" width="14" height="6" fill="#1E1E24"/>
                </svg>
            </div>

            <div class="store-badges-col">
                <a href="https://apps.apple.com" class="store-badge" target="_blank" rel="noopener">
                    <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" alt="Download on the App Store">
                </a>
                <a href="https://play.google.com" class="store-badge" target="_blank" rel="noopener">
                    <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play" style="height: 34px; width: 116px; object-fit: cover; object-position: center;">
                </a>
            </div>
        </div>

    </div>

    <!-- Bottom-Left Footer matching setlog.kr exactly -->
    <footer>
        <div class="footer-line-1">
            Fin Rein Inc. · Registered Office: Kanpur & Lucknow · Email: mypalsapp1@gmail.com
        </div>
        <div class="footer-line-2">
            © 2026 Fin Rein Inc. · <a href="privacy.html">Privacy Policy</a> · <a href="tos.html">Terms of Service</a> · <a href="csampolicy.html">CSAM Policy</a>
        </div>
    </footer>

</body>
</html>
